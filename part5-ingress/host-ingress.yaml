apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: blue.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-blue
                port:
                  number: 80
    - host: green.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-green
                port:
                  number: 80